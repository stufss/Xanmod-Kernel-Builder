name: Check NVIDIA Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh

      - name: Get latest CachyOS NVIDIA version
        id: latest
        run: |
          VERSION=$(
            curl -fsSL "https://packages.cachyos.org/package/cachyos/x86_64/nvidia-utils" |
            grep -aPo 'pkg_version:"\K[^"]+' |
            head -n1 |
            cut -d- -f1
          )

          if [ -z "$VERSION" ]; then
            echo "Failed to determine latest NVIDIA version."
            exit 1
          fi

          echo "Latest: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read current version
        id: current
        run: |
          VERSION=$(grep '^NVIDIA_VER=' build.config | cut -d= -f2)
          echo "Current: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.current.outputs.version }}" = "${{ steps.latest.outputs.version }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if up-to-date
        if: steps.compare.outputs.changed == 'false'
        run: |
          echo "Already on latest NVIDIA version."
          exit 0

      - name: Update build.config
        run: |
          sed -i \
            "s/^NVIDIA_VER=.*/NVIDIA_VER=${{ steps.latest.outputs.version }}/" \
            build.config

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add build.config
          git commit -m "nvidia: bump to ${{ steps.latest.outputs.version }}"
          git push

      - name: Trigger kernel build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml
