name: build

on:
  workflow_dispatch:
    inputs:
      LLVM_VER:
        description: 'LLVM_VER (Specify LLVM Version)'
        required: true
        default: '19'
      KERNEL_VER:
        description: 'KERNEL_VER (Specify XANMOD branch to build)'
        required: true
        default: '6.12'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: "🚧 Build Xanmod for omen16"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Environment Variables
        run: |
          echo 'KERNEL_VER == > ${{ github.event.inputs.KERNEL_VER }}'

      - name: Free up Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install packages & setup
        run: |
          sudo apt update
          sudo apt purge firefox -y
          sudo apt upgrade

          sudo apt install \
            wget \
            build-essential \
            bison \
            flex \
            pkg-config \
            qtcreator \
            qtbase5-dev \
            qt5-qmake \
            qttools5-dev-tools \
            libssl-dev \
            libncurses-dev \
            git \
            libelf-dev \
            lz4 \
            debhelper \
            dh-virtualenv \
            zstd \
            elfutils -y

      - name: Setup Clang/LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ github.event.inputs.LLVM_VER }}

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://gitlab.com/xanmod/linux -b ${{ github.event.inputs.KERNEL_VER }} kernel/xanmod

      - name: Run Build
        run: |
          export KERNEL_VER=${{ github.event.inputs.KERNEL_VER }}
          export LLVM_VER=${{ github.event.inputs.LLVM_VER}}
          ./build.sh

      - name: Set Release Tag Output
        id: release-tag
        run: |
          echo "NOW=$(date "+%y%m%d%H%M")" >> "$GITHUB_OUTPUT"
          echo "SUBVERSION=$(make -f kernel/xanmod/Makefile kernelversion)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./kernel/xanmod/*tar.xz"
          tag: xanmod-${{ steps.release-tag.outputs.SUBVERSION }}-${{ github.event.inputs.LLVM_VER}}-omen16-${{ steps.release-tag.outputs.NOW }}
